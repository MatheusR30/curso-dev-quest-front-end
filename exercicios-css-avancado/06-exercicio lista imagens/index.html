<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de imagens</title>
    <link rel="stylesheet" href="src/css/style.css" />
    <link rel="stylesheet" href="src/css/responsive.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    />
  </head>
  <body>
    <article class="article">
      <div class="image-container">
        <img src="src/images/rome.png" alt="roma" />
        <p><span>Roma </span> <br />Michelangelo</p>
      </div>

      <div class="image-container">
        <img src="src/images/boat.png" alt="botes na praia" />
        <p><span>Boat at Sea </span><br />Vincent Van Gogh</p>
      </div>

      <div class="image-container">
        <img src="src/images/sand-and-sea.png" alt="agua com areia" />
        <p><span>Sand and Sea </span><br />Da Vinci</p>
      </div>

      <div class="image-container">
        <img src="src/images/starry-night.png" alt="noite" />
        <p><span>Starry Night </span><br />Vicent Van Gogh</p>
      </div>
    </article>
  </body>
</html>
