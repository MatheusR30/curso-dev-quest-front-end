<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsividade com Media Query</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="card">
        <h2>Ola essa é a primeira image</h2>
        <img src="https://picsum.photos/250/200?random=1" alt="carde 1" />
      </div>

      <div class="card">
        <h2>Ola essa é a segunda image</h2>
        <img src="https://picsum.photos/250/200?random=2" alt="carde 2" />
      </div>

      <div class="card">
        <h2>Ola essa é a terceira image</h2>
        <img src="https://picsum.photos/250/200?random=3" alt="carde 3" />
      </div>
    </main>
  </body>
</html>
