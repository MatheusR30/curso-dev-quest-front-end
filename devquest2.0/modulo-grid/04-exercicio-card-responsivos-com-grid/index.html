<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>exercicio cards responsivos com grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="item">
        <h2>Camera</h2>
        <img src="images/camera-514992_640.jpg" alt="camera fotografica" />
        <p>Camera fotografica</p>
      </div>
      <div class="item">
        <h2>Drone</h2>
        <img src="images/drones-images-3525497_640.jpg" alt="drone voando" />
        <p>Drone voando</p>
      </div>
      <div class="item">
        <h2>Elefante</h2>
        <img src="images/elephant-3095554_640.png" alt="elefante grande" />
        <p>Elegante</p>
      </div>
      <div class="item">
        <h2>Olho de elefante</h2>
        <img
          src="images/elephants-eye-5568016_640.jpg"
          alt="olho de elefante"
        />
        <p>Olho de elegante</p>
      </div>
      <div class="item">
        <h2>Colher de mel</h2>
        <img src="images/honey-1970592_640.jpg" alt="colher de mel" />
        <p>Colher de mel</p>
      </div>
      <div class="item">
        <h2>Porco</h2>
        <img src="images/pig-dog-2613125_640.jpg" alt="porco deitado" />
        <p>Porco</p>
      </div>
    </div>
  </body>
</html>
